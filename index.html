:root { --ink:#1a1a1a; --mut:#8a8a8a; --line:#e8e8e8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fff; }
body {
  font-family: "SimSun", "宋体", "Songti SC", serif;
  color: var(--ink); padding: 12px; max-width: 900px; margin: 0 auto;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: calc(12px + env(safe-area-inset-left, 0px));
  padding-right: calc(12px + env(safe-area-inset-right, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
.ctl { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px;
  font-family: -apple-system, "PingFang SC", sans-serif; }
.ctl input, .ctl button, .ctl select { font-size: 13px; padding: 7px 8px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #333; }
.ctl button { background: #1a1a1a; color: #fff; border: none; font-weight: 600; }
.ctl .dt { flex: 1; min-width: 170px; } .ctl .lng { width: 72px; }
.ctl .birth { width: 90px; }
.ctl .zhan { flex: 1; min-width: 150px; font-size: 16px; }
.tbox { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 14px; }
.trow { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 6px 10px; }
.trow label { min-width: 2.4em; color: #333; }
.trow .dt { flex: 1; min-width: 160px; font-size: 14px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 6px; }
.trow #city { font-size: 14px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 6px; }
.trow #zsText { color: #c0392b; font-weight: 600; }
.trow input[type=radio] { accent-color: #3a5fcd; }
#gzInputs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#gzInputs .p-in { display: flex; flex-direction: column; gap: 3px; }
#gzInputs .p-in select, #gzInputs > select { padding: 3px 4px; font-size: 14px; }

.h { font-size: 17px; line-height: 1.55; color: #333; white-space: pre-wrap; }
.h .pillars { display: inline-flex; gap: 12px; vertical-align: middle; }
.h .sz { display: inline-flex; flex-direction: column; align-items: center; color: #c0392b; line-height: 1.05; font-weight: 600; }
.h .sz .g, .h .sz .z { font-size: 18px; }
.h .tail { margin-left: 16px; color: #333; vertical-align: middle; }
.h .tail .blue, .h .blue { color: #3a5fcd; font-weight: 600; }
.pan {
  margin: 8px 0 0; font-family: "KaiEmbed", "Kaiti SC", "Kaiti", "STKaiti", "KaiTi", "楷体", "BiauKai", serif;
  font-size: 22px; line-height: 1.5; color: #1a1a1a;
}
.prow { position: relative; height: 1.5em; }
.pc { position: absolute; top: 0; white-space: pre; }

        _getYearNineStar:function(yearInGanZhi){
          var indexExact = LunarUtil.getJiaZiIndex(yearInGanZhi) + 1;
          var index = LunarUtil.getJiaZiIndex(this.getYearInGanZhi()) + 1;
          var yearOffset = indexExact - index;
          if (yearOffset > 1) {
            yearOffset -= 60;
          } else if (yearOffset < -1) {
            yearOffset += 60;
          }
          var yuan = Math.floor((this._p.year + yearOffset + 2696) / 60) % 3;
          var offset = (62 + yuan * 3 - indexExact) % 9;
          if(0 === offset){
            offset = 9;
          }
          return NineStar.fromIndex(offset - 1);
        },
        getYearNineStar:function(sect){
          var yearInGanZhi;
          switch (sect) {
            case 1:
              yearInGanZhi = this.getYearInGanZhi();
              break;
            case 3:
              yearInGanZhi = this.getYearInGanZhiExact();
              break;
            default:
              yearInGanZhi = this.getYearInGanZhiByLiChun();
          }
          return this._getYearNineStar(yearInGanZhi);
        },
        getMonthNineStar:function(sect){
          var yearZhiIndex;
          var monthZhiIndex;
          switch (sect) {
            case 1:
              yearZhiIndex = this._p.yearZhiIndex;
              monthZhiIndex = this._p.monthZhiIndex;
              break;
            case 3:
              yearZhiIndex = this._p.yearZhiIndexExact;
              monthZhiIndex = this._p.monthZhiIndexExact;
              break;
            default:
              yearZhiIndex = this._p.yearZhiIndexByLiChun;
              monthZhiIndex = this._p.monthZhiIndex;
          }
          var n = 27 - (yearZhiIndex % 3 * 3);
          if (monthZhiIndex < LunarUtil.BASE_MONTH_ZHI_INDEX) {
            n -= 3;
          }
          return NineStar.fromIndex((n - monthZhiIndex) % 9);
        },
        getDayNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var dongZhi = this._getJieQiSolar(I18n.getMessage('jq.dongZhi'));
          var dongZhi2 = this._getJieQiSolar('DONG_ZHI');
          var xiaZhi = this._getJieQiSolar(I18n.getMessage('jq.xiaZhi'));
          var dongZhiIndex = LunarUtil.getJiaZiIndex(dongZhi.getLunar().getDayInGanZhi());
          var dongZhiIndex2 = LunarUtil.getJiaZiIndex(dongZhi2.getLunar().getDayInGanZhi());
          var xiaZhiIndex = LunarUtil.getJiaZiIndex(xiaZhi.getLunar().getDayInGanZhi());
          var solarShunBai;
          var solarShunBai2;
          var solarNiZi;
          if (dongZhiIndex>29) {
            solarShunBai = dongZhi.next(60 - dongZhiIndex);
          } else {
            solarShunBai = dongZhi.next(-dongZhiIndex);
          }
          var solarShunBaiYmd = solarShunBai.toYmd();
          if (dongZhiIndex2>29) {
            solarShunBai2 = dongZhi2.next(60 - dongZhiIndex2);
          } else {
            solarShunBai2 = dongZhi2.next(-dongZhiIndex2);
          }
          var solarShunBaiYmd2 = solarShunBai2.toYmd();
          if (xiaZhiIndex>29) {
            solarNiZi = xiaZhi.next(60 - xiaZhiIndex);
          } else {
            solarNiZi = xiaZhi.next(-xiaZhiIndex);
          }
          var solarNiZiYmd = solarNiZi.toYmd();
          var offset = 0;
          if (solarYmd >= solarShunBaiYmd && solarYmd < solarNiZiYmd) {
            offset = this._p.solar.subtract(solarShunBai) % 9;
          } else if (solarYmd >= solarNiZiYmd && solarYmd < solarShunBaiYmd2){
            offset = 8 - (this._p.solar.subtract(solarNiZi) % 9);
          } else if (solarYmd >= solarShunBaiYmd2) {
            offset = this._p.solar.subtract(solarShunBai2) % 9;
          } else if (solarYmd < solarShunBaiYmd) {
            offset = (8 + solarShunBai.subtract(this._p.solar)) % 9;
          }
          return NineStar.fromIndex(offset);
        },
        getTimeNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var asc = false;
          if((solarYmd >= this._getJieQiSolar(I18n.getMessage('jq.dongZhi')).toYmd() && solarYmd < this._getJieQiSolar(I18n.getMessage('jq.xiaZhi')).toYmd()) || solarYmd >= this._getJieQiSolar('DONG_ZHI').toYmd()){
            asc = true;
          }
          var offset = asc ? [0, 3, 6] : [8, 5, 2];
          var start = offset[this.getDayZhiIndex() % 3];
          var timeZhiIndex = this.getTimeZhiIndex();
          var index = asc ? (start + timeZhiIndex) : (start + 9 - timeZhiIndex);
          return NineStar.fromIndex(index % 9);
        },

      XIU_SONG:{
        '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
        '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
        '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
        '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
        '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
        '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
        '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
        '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
        '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
        '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
        '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
        '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
        '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
        '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
        '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
        '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
        '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
        '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
        '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
        '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
        '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
        '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
        '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
        '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
        '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
        '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
        '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
        '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'
      },

// 行年支 12 年一轮：(虚岁-1) mod 12 = (占事年支 - 本命支) mod 12，故无需虚岁
function autoNianMing() {
  const bi = ZHI.indexOf(document.getElementById('bm').value);
  if (bi < 0) { document.getElementById('xn').value = ''; return; }
  const dp = document.getElementById('dt').value;
  const eventYear = dp ? +dp.split('T')[0].split('-')[0] : new Date().getFullYear();
  const eventZhi = (((eventYear - 4) % 12) + 12) % 12;
  const off = (((eventZhi - bi) % 12) + 12) % 12;
  const gender = document.getElementById('gender').value;
  const xz = gender === '男' ? (2 + off) % 12 : (((8 - off) % 12) + 12) % 12;
  document.getElementById('xn').value = ZHI[xz];
}

// 与「网络案例」模板一致的字符网格版式
function compose(r) {
  const rows = [];
  const put = (row, col, text, cls) => { if (!text) return; if (!rows[row]) rows[row] = []; rows[row].push({ col, text: String(text), cls }); };
  const js = n => JS[n] || n;
  const jOf = z => { const t = r.tianpan.find(x => x.zhiIdx === z); return t ? js(t.jiang) : ''; };
  const kongSet = new Set(r.xunKong);
  // 落空：天盘支加临地盘空亡宫（地盘空亡支 -> 其上的天盘支）
  const luoKong = new Set();
  for (let g = 0; g < 12; g++) if (kongSet.has(ZHI[g])) luoKong.add(r.tianpan[g].zhi);
  const TOP = 9, STEP = 3, COL_R = TOP + STEP * 3; // 18

  [5,6,7,8].forEach((g,i)=>{ const c = r.tianpan[g], col = TOP + i*STEP;
    put(0, col, c.dunGan || '◎', 'gan'); put(1, col, js(c.jiang), 'jiang'); put(2, col, c.zhi, 'zhi'); });
  [2,1,0,11].forEach((g,i)=>{ const c = r.tianpan[g], col = TOP + i*STEP;
    put(5, col, c.zhi, 'zhi'); put(6, col, js(c.jiang), 'jiang'); put(7, col, c.dunGan || '◎', 'gan'); });
  [4,3].forEach((g,i)=>{ const c = r.tianpan[g], rr = 3 + i;
    put(rr, TOP-6, c.dunGan || '◎', 'gan'); put(rr, TOP-3, js(c.jiang), 'jiang'); put(rr, TOP, c.zhi, 'zhi'); });
  [9,10].forEach((g,i)=>{ const c = r.tianpan[g], rr = 3 + i;
    put(rr, COL_R, c.zhi, 'zhi'); put(rr, COL_R+3, js(c.jiang), 'jiang'); put(rr, COL_R+6, c.dunGan || '◎', 'gan'); });

  const COL_SIKE = COL_R + 11; // 29
  const downs = [r.dayGz[0], r.sike[0].zhi, r.dayZhi, r.sike[2].zhi]; // [干阳下,干阴下,支阳下,支阴下]
  // 课式传统顺序：左→右 = 支阴, 支阳, 干阴, 干阳
  [3,2,1,0].forEach((oi, i) => { const col = COL_SIKE + i*STEP;
    const k = r.sike[oi];
    put(1, col, k.dunGan || '◎', 'gan'); put(2, col, jOf(k.zhiIdx), 'jiang');
    put(3, col, k.zhi, 'up'); put(4, col, downs[oi], 'down'); });

  const COL_CHUAN = COL_SIKE + 4*STEP + 4; // 45
  r.sanchuan.forEach((k,i)=>{ const rr = 2 + i, isKong = kongSet.has(k.zhi);
    put(rr, COL_CHUAN, LQ[k.liuqin] || k.liuqin, 'qin');
    put(rr, COL_CHUAN+3, isKong ? '' : (k.dunGanzhi.slice(0,1) || ''), 'gan');
    put(rr, COL_CHUAN+6, k.zhi, 'czhi');
    put(rr, COL_CHUAN+9, js(k.jiang), 'jiang');
    const mark = (isKong ? '◎' : '') + (luoKong.has(k.zhi) ? '⊙' : '');
    if (mark) put(rr, COL_CHUAN+12, mark, 'kong'); });

  return rows.map(cells => {
    if (!cells) return '<div class="prow"></div>';
    cells.sort((a,b) => a.col - b.col);
    return '<div class="prow">' + cells.map(c =>
      `<span class="pc ${c.cls}" style="left:${(c.col * 0.5 - 1.5).toFixed(2)}em">${esc(c.text)}</span>`
    ).join('') + '</div>';
  }).join('');
}

let noteText = '';
function render(r) {
  const keti = [r.keti, ...r.ketiExtra].filter(Boolean).join('、');
  const pillarsHtml = (r.sizhu || []).map(z => `<span class="sz"><span class="g">${z.gan}</span><span class="z">${z.zhi}</span></span>`).join('');
  const tailHtml = `<span class="tail">月将 <b class="blue">${r.jiangZhi}</b>${r.bengMingZhi ? `　本命 <b class="blue">${r.bengMingZhi}</b>` : ''}${r.xingNianZhi ? `　行年 <b class="blue">${r.xingNianZhi}</b>` : ''}</span>`;
  const fourLine = `<div class="h"><span class="pillars">${pillarsHtml}</span>${tailHtml}</div>`;
  const shx = (label, pred) => {
    const items = r.shensha.filter(pred);
    const rank = s => s.byKe ? 0 : (s.byMing && s.byXing ? 3 : s.byMing ? 1 : 2);
    const cnt = {}; items.forEach(x => { cnt[x.zhi] = (cnt[x.zhi] || 0) + 1; }); const byGroup = (a, b) => (cnt[b.zhi] - cnt[a.zhi]) || (rank(a) - rank(b)) || (a.zhi - b.zhi); const hits = items.filter(s => s.hit).sort(byGroup);
    const rest = items.filter(s => !s.hit).sort(byGroup);
    const cell = s => {
      const tag = s.hit && !s.byKe ? (s.byMing && s.byXing ? '命行' : s.byMing ? '命' : '行') : '';
      return `<span class="shx${s.hit?' hit':''}">${s.name}${s.zhiName?`<span class="zhi">-${s.zhiName}</span>`:''}${tag?`<span class="tag">（${tag}）</span>`:''}</span>`;
    };
    const grid = arr => `<div class="shx-grid">${arr.map(cell).join('')}</div>`;
    return `<div class="sec-h">${label}</div><div class="shx-wrap">${hits.length ? grid(hits) : ''}${rest.length ? grid(rest) : ''}</div>`;
  };
  const bifa = r.bifa.length
    ? r.bifa.map(b => `<span class="b">${b.num}.${b.title}${[58,86,95].includes(b.num)?'<span class="todo">（待查）</span>':''}</span>`).join('')
    : '<span>（无命中）</span>';

  const extra = '';
  const topSection = r.isGz
    ? fourLine + '<hr class="div2">' + shx('常规神煞', s => s.display === '必查') + shx('特殊神煞', s => s.display === '特殊事件')
    : `<div class="h">${r.year}年${r.month}月${r.day}日 ${pad(r.hour)}:${pad(r.minute)}</div>` +
      fourLine + '<hr class="div2">' + shx('常规神煞', s => s.display === '必查') + shx('特殊神煞', s => s.display === '特殊事件');

  document.getElementById('main').innerHTML = `
  <div class="sheet">${topSection}</div>
  <hr class="divider">
  <div class="sheet">
    <div class="pan-scroll"><div class="pan">${compose(r)}</div></div>
    <div class="keti">课体：${keti || '—'}</div>
    <hr class="divider">
    <div class="bifa-row"><div class="bifa">毕法：<br>${bifa}</div><textarea class="note" id="note" placeholder="记录…">${noteText || ""}</textarea></div>
  </div>`;
  applyFit();
  requestAnimationFrame(() => alignBifa());
}

// 记录框左边缘对齐天地盘最右边竖列（地盘支列）
function alignBifa() {
  const row = document.querySelector('.bifa-row');
  const note = document.querySelector('.bifa-row .note');
  const pan = document.querySelector('.pan');
  if (!row || !note || !pan) return;
  row.style.paddingLeft = '0px';
  note.style.marginLeft = '0px';
  note.style.width = '420px';
  note.style.maxWidth = 'none';
  const zs = [...document.querySelectorAll('.pan .pc.zhi')];
  const ringRight = zs.length ? Math.max(...zs.map(z => z.getBoundingClientRect().right)) : 0;
  const noteLeft0 = note.getBoundingClientRect().left;
  note.style.marginLeft = Math.max(0, Math.round(ringRight - noteLeft0)) + 'px';
  const panRight = pan.getBoundingClientRect().right;
  const noteLeft = note.getBoundingClientRect().left;
  const w = Math.max(140, Math.min(420, Math.round(panRight - noteLeft)));
  note.style.width = w + 'px';
  note.style.maxWidth = '100%';
}

// 盘面适应屏幕宽度（默认开）
let fitOn = true;
function applyFit() {
  const pre = document.querySelector('.pan-scroll .pan');
  if (!pre) return;
  pre.style.zoom = '';
  if (!fitOn) return;
  const wrap = pre.parentElement;
  requestAnimationFrame(() => {
    const natural = pre.scrollWidth;
    const avail = wrap.clientWidth - 8;   // 右侧留 8px 余量
    if (natural > avail) pre.style.zoom = avail / natural;
  });
}
document.getElementById('fit').classList.add('on');
document.getElementById('fit').addEventListener('click', () => {
  fitOn = !fitOn;
  document.getElementById('fit').classList.toggle('on', fitOn);
  applyFit();
});
// 截图模式
document.getElementById('shot').addEventListener('click', () => { document.body.classList.add('shot'); applyFit(); });
document.getElementById('exitShot').addEventListener('click', () => { document.body.classList.remove('shot'); applyFit(); });
window.addEventListener('resize', () => { applyFit(); });
document.addEventListener('input', e => { if (e.target && e.target.id === 'note') noteText = e.target.value; });


document.getElementById('dt').value = nowLocal();
autoNianMing();
// 空本命时行年置空（对抗浏览器表单状态恢复）
function resetXnIfNoBm() { if (!document.getElementById('bm').value) { const x = document.getElementById('xn'); if (x) x.value = ''; } }
setTimeout(resetXnIfNoBm, 0);
window.addEventListener('pageshow', () => setTimeout(resetXnIfNoBm, 0));
// 真太阳时预览
function updateZs() {
  const v = document.getElementById('dt').value;
  if (!v) return;
  const [date, time] = v.split('T');
  const [y,m,d] = date.split('-').map(Number);
  const [H,M] = (time||'0:0').split(':').map(Number);
  const city = currentCity();
  const s = solarOf(y, m, d, H, M, city.lng, true);
  document.getElementById('zsText').textContent = `${s.hourZhi}时 ${pad(s.H)}:${pad(s.M)}（${city.prov}-${city.name} ${city.lng}°）`;
}
document.getElementById('dt').addEventListener('change', () => { updateZs(); autoNianMing(); });
document.getElementById('dt').addEventListener('input', updateZs);
document.getElementById('city').addEventListener('change', updateZs);
document.getElementById('tmZs').addEventListener('change', updateZs);
updateZs();

document.getElementById('go').addEventListener('click', () => {
  const mode = document.getElementById('mode').value;
  const bm = document.getElementById('bm').value, xn = document.getElementById('xn').value;
  const shRule = document.getElementById('shRule').value;
  const guiMode = document.getElementById('guiMode').value;
  if (mode === 'gz') {
    const v = id => document.getElementById(id).value;
    render(paipanByGz(
      GAN.indexOf(v('gzNG')), ZHI.indexOf(v('gzNZ')),
      GAN.indexOf(v('gzYG')), ZHI.indexOf(v('gzYZ')),
      GAN.indexOf(v('gzRG')), ZHI.indexOf(v('gzRZ')),
      GAN.indexOf(v('gzSG')), ZHI.indexOf(v('gzSZ')),
      ZHI.indexOf(v('gzJiang')),
      bm ? ZHI.indexOf(bm) : null, xn ? ZHI.indexOf(xn) : null,
      shRule, guiMode
    ));
    return;
  }
  const [date, time] = document.getElementById('dt').value.split('T');
  const [y,m,d] = date.split('-').map(Number);
  const [H,M] = (time||'0:0').split(':').map(Number);
  const useTrueSolar = document.getElementById('tmZs').checked;
  const city = currentCity();
  const lng = useTrueSolar ? city.lng : 120;
  render(paipan(y, m, d, H, M, lng, bm ? ZHI.indexOf(bm) : null, xn ? ZHI.indexOf(xn) : null, shRule, guiMode, useTrueSolar));
});
document.getElementById('go').click();

// 重置：恢复到当前时间，并清空本命/行年
document.getElementById('reset').addEventListener('click', () => {
  document.getElementById('dt').value = nowLocal();
  document.getElementById('bm').value = '';
  document.getElementById('xn').value = '';
  document.getElementById('zhanShi').value = ''; noteText = '';
  updateZs();
  document.getElementById('go').click();
});

const LS = 'liuren-paipan-v1';
const loadHist = () => { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch (e) { return []; } };
const saveHist = l => localStorage.setItem(LS, JSON.stringify(l));
function renderHist() {
  const l = loadHist();
  document.getElementById('hist').innerHTML = l.length
    ? `<div class="sheet"><div class="sec-h">已存（${l.length}）<button id="clear" class="clr">清空</button></div>${l.map((h,i)=>`<div class="hist-item" data-i="${i}"><span>${h.label}</span><span class="hdel" data-del="${i}">×</span></div>`).join('')}</div>` : '';
}
document.getElementById('save').addEventListener('click', () => {
  const dt = document.getElementById('dt').value;
  const bm = document.getElementById('bm').value, xn = document.getElementById('xn').value;
  const shRule = document.getElementById('shRule').value, guiMode = document.getElementById('guiMode').value;
  const useTrueSolar = document.getElementById('tmZs').checked;
  const city = currentCity();
  const lng = useTrueSolar ? city.lng : 120;
  const [date, time] = dt.split('T'); const [y,m,d] = date.split('-').map(Number);
  const [H,M] = (time||'0:0').split(':').map(Number);
  const r = paipan(y, m, d, H, M, lng, bm?ZHI.indexOf(bm):null, xn?ZHI.indexOf(xn):null, shRule, guiMode, useTrueSolar);
  const k = [r.keti, ...r.ketiExtra].filter(Boolean).join('·');
  const zs = (document.getElementById('zhanShi').value || '').trim();
  const list = loadHist();
  const base = `${r.dayGz}日 ${k} ｜ ${r.sanchuan.map(s=>s.dunGanzhi).join(' ')}`;
  list.unshift({ id: Date.now(), dt, lng, bm, xn, zs, label: zs ? `【${zs}】${base}` : base });
  saveHist(list.slice(0,200)); renderHist();
});
document.getElementById('hist').addEventListener('click', e => {
  if (e.target.id === 'clear') { saveHist([]); renderHist(); return; }
  const del = e.target.closest('[data-del]'), it = e.target.closest('[data-i]');
  if (del) { const l = loadHist(); l.splice(+del.dataset.del,1); saveHist(l); renderHist(); }
  else if (it) { const h = loadHist()[+it.dataset.i]; if (h) { document.getElementById('dt').value=h.dt; document.getElementById('bm').value=h.bm||''; document.getElementById('xn').value=h.xn||''; document.getElementById('go').click(); } }
});
renderHist();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script>
</body>
</html>
